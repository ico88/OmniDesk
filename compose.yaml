name: omnidesk
x-api: &api
  image: omnidesk-api:local
  build:
    context: .
    dockerfile: src/OmniDesk.Api/Dockerfile
  environment:
    Database__Host: db
    Database__PasswordFile: /run/secrets/db_password
    DataProtection__Path: /keys
  networks: [backend]
  secrets:
    - db_password
  volumes:
    - identity_keys:/keys
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_DB: omnidesk
      POSTGRES_USER: omnidesk
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U omnidesk -d omnidesk]
      interval: 5s
      timeout: 3s
      retries: 20
  # Initialize writable DataProtection volume for the unprivileged API user.
  keys-init:
    image: alpine:3.22
    user: root
    network_mode: none
    command: [sh, -c, 'chown 1654:1654 /keys && chmod 700 /keys']
    volumes:
      - identity_keys:/keys
  migrate:
    <<: *api
    profiles: [tools]
    command: [--migrate]
  bootstrap:
    <<: *api
    profiles: [bootstrap]
    environment:
      Database__Host: db
      Database__PasswordFile: /run/secrets/db_password
      Bootstrap__Email: ${ADMIN_EMAIL:-}
      Bootstrap__PasswordFile: /run/secrets/bootstrap_password
    secrets:
      - db_password
      - bootstrap_password
    command: [--bootstrap]
  api:
    <<: *api
    networks: [backend, proxy]
    environment:
      Database__Host: db
      Database__PasswordFile: /run/secrets/db_password
      DataProtection__Path: /keys
      Proxy__Network: ${OMNIDESK_PROXY_SUBNET:-172.29.84.0/24}
      Security__TotpEnabled: ${OMNIDESK_TOTP_ENABLED:-false}
      Downloads__Directory: /packages
    volumes:
      - identity_keys:/keys
      - ./artifacts/windows-lan:/packages:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keys-init:
        condition: service_completed_successfully
  dashboard:
    networks: [proxy]
    image: omnidesk-dashboard:local
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    restart: unless-stopped
  caddy:
    networks: [proxy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${OMNIDESK_BIND_ADDRESS:-192.168.1.233}:${OMNIDESK_HTTPS_PORT:-8085}:443"
    environment:
      OMNIDESK_DOMAIN: ${OMNIDESK_DOMAIN:?Set OMNIDESK_DOMAIN}
      OMNIDESK_LAN_IP: ${OMNIDESK_LAN_IP:-192.168.1.233}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
secrets:
  db_password:
    file: ./.secrets/db_password
  bootstrap_password:
    file: ./.secrets/bootstrap_password
volumes:
  postgres_data:
  identity_keys:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: ${OMNIDESK_PROXY_SUBNET:-172.29.84.0/24}

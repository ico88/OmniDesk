name: build-and-test
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  milestone-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n setup.sh scripts/test.sh scripts/smoke.sh scripts/backup.sh scripts/backup-nas.sh scripts/prepare-backup-directory.sh scripts/prune-backups.sh scripts/verify-backup.sh scripts/validate-release.sh tests/backup-verification-tests.sh tests/backup-retention-tests.sh tests/backup-nas-tests.sh
      - run: bash tests/backup-verification-tests.sh
      - run: bash tests/backup-retention-tests.sh
      - run: bash tests/backup-nas-tests.sh
      - run: node --check scripts/restore-runtime-smoke.mjs
      - run: ./scripts/test.sh
      - run: docker compose -f compose.test.yaml config --quiet
      - run: BACKUP_CHECK_FILE=/tmp/omnidesk-test-backup.dump docker compose -f compose.backup-check.yaml config --quiet
      - run: RESTORE_BACKUP_PATH="$GITHUB_WORKSPACE" RESTORE_CHECK_DIR=/tmp docker compose -f compose.restore-check.yaml config --quiet
      - run: docker build -t omnidesk-api:local -f src/OmniDesk.Api/Dockerfile .
      - run: docker build -t omnidesk-dashboard:local -f src/dashboard/Dockerfile .
      - run: ./scripts/smoke.sh --browser

name: windows-agent-package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  agent-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/OmniDesk.Agent.Windows -c Release
      - run: dotnet publish src/OmniDesk.Agent.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/agent-win-x64
      - name: Windows collector, DPAPI and temporary ACL checks
        run: '& .\artifacts\agent-win-x64\OmniDesk.Agent.Windows.exe self-test'
      - name: Parse Windows Update script without executing it
        shell: powershell
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/src/OmniDesk.Agent.Windows/update-worker.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Windows Update script parser errors" }
      - run: dotnet build installer/OmniDesk.Agent -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: omnidesk-agent-unsigned
          if-no-files-found: error
          path: installer/OmniDesk.Agent/bin/**/OmniDesk.Agent.msi
  console:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/OmniDesk.Console.Windows -c Release -r win-x64 --self-contained true -o artifacts/console-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: omnidesk-console-unsigned
          if-no-files-found: error
          path: artifacts/console-win-x64/**

name: windows-agent-package
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      native_installer_only:
        description: Build the native Windows installer without running tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  agent-msi:
    if: ${{ inputs.native_installer_only != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Parse Windows Update script without executing it
        shell: powershell
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/src/OmniDesk.Agent.Windows/update-worker.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Windows Update script parser errors" }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/Install-OmniDeskAgent.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "LAN installer script parser errors" }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/Build-OmniDeskWindows.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Windows build script parser errors" }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/Test-OmniDeskMsi.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Windows MSI test parser errors" }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/Test-OmniDeskUpgrade.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Windows MSI upgrade test parser errors" }
      - name: Verify masked enrollment prompt
        shell: powershell
        run: '& .\installer\Test-OmniDeskEnrollmentPrompt.ps1'
      - name: Verify installer source retention and sensitive cleanup
        shell: powershell
        run: '& .\installer\Test-OmniDeskInstallerCleanup.ps1'
      - name: Verify fixed PowerShell worker process policy
        shell: powershell
        run: '& .\installer\Test-OmniDeskUpdateProcess.ps1'
      - name: Verify Tray protocol contracts
        run: dotnet test tests/OmniDesk.Api.Tests -c Release --filter FullyQualifiedName~TrayProtocolTests
      - name: Build Agent, Tray and single MSI
        shell: powershell
        run: '& .\installer\Build-OmniDeskWindows.ps1'
      - name: Verify MSI install, recovery and uninstall on isolated runner
        shell: powershell
        run: |
          $msi = @(Get-ChildItem artifacts/windows-*/OmniDesk.Agent.msi)
          if ($msi.Count -ne 1) { throw "Atteso un singolo MSI" }
          & .\installer\Test-OmniDeskMsi.ps1 -MsiPath $msi[0].FullName
      - name: Build pinned baseline and verify upgrade, repair and rollback
        shell: powershell
        run: |
          $baselines = @(
            @{ Commit='98bba683420ff6ecdc14f9f401495b17291606b3'; Version='0.6.0' },
            @{ Commit='742d13f1c6a82dc035613e2ee86d9b1e0c0df2b0'; Version='0.7.0' }
          )
          foreach ($spec in $baselines) {
            $baseline = Join-Path $env:RUNNER_TEMP ('OmniDesk-baseline-' + $spec.Version)
            git fetch origin $spec.Commit --depth=1
            if ($LASTEXITCODE -ne 0) { throw "Baseline source fetch failed" }
            git worktree add --detach $baseline FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "Baseline worktree failed" }
            & (Join-Path $baseline 'installer/Build-OmniDeskWindows.ps1')
            $old = Join-Path $baseline ('artifacts/windows-' + $spec.Version + '/OmniDesk.Agent.msi')
            $new = @(Get-ChildItem artifacts/windows-*/OmniDesk.Agent.msi)
            if ($new.Count -ne 1) { throw "Expected a single current MSI" }
            & .\installer\Test-OmniDeskUpgrade.ps1 -BaselineMsi $old -NewMsi $new[0].FullName
            Get-ChildItem artifacts/msi-*.log | Rename-Item -NewName { $_.BaseName + '-from-' + $spec.Version + $_.Extension }
          }
      - name: Upload isolated MSI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omnidesk-msi-diagnostics
          if-no-files-found: ignore
          path: artifacts/msi-*.log
      - uses: actions/upload-artifact@v7
        with:
          name: omnidesk-agent-unsigned
          if-no-files-found: error
          path: |
            artifacts/windows-*/OmniDesk.Agent.msi
            artifacts/windows-*/OmniDesk.Setup.exe
            artifacts/windows-*/SHA256SUMS.txt
  console:
    if: ${{ inputs.native_installer_only != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/OmniDesk.Console.Windows -c Release -r win-x64 --self-contained true -o artifacts/console-win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: omnidesk-console-unsigned
          if-no-files-found: error
          path: artifacts/console-win-x64/**

  native-installer:
    if: ${{ inputs.native_installer_only == true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/OmniDesk.Agent.Windows/OmniDesk.Agent.Windows.csproj'
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Agent package version is missing.' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build unsigned lab MSI and setup
        shell: pwsh
        run: |
          & .\installer\Build-OmniDeskWindows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ steps.version.outputs.value }}-unsigned-lab
          if-no-files-found: error
          path: artifacts/windows-${{ steps.version.outputs.value }}/*

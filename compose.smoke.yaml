name: omnidesk-smoke
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: omnidesk
      POSTGRES_USER: omnidesk
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U omnidesk -d omnidesk]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: omnidesk-api:local
    command: [--migrate]
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
  bootstrap:
    image: omnidesk-api:local
    command: [--bootstrap]
    environment:
      Bootstrap__Email: admin@example.test
    secrets: [db_password, bootstrap_password]
    depends_on:
      db:
        condition: service_healthy
  api:
    image: omnidesk-api:local
    environment:
      DataProtection__Path: /keys
      Proxy__Network: 172.29.85.0/24
      Downloads__Directory: /packages
      Attachments__RootPath: /attachments
      Attachments__ClamAvHost: clamav
      EmailIntake__SigningKeyFile: /run/secrets/email_intake_key
      EmailIntake__AllowedMailboxes__0: support@example.test
      RustDesk__IdServer: omnidesk.test
      RustDesk__RelayServer: omnidesk.test
      RustDesk__PublicKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    volumes:
      - ${SMOKE_SECRETS:?Set isolated secret directory}/downloads:/packages:ro
    secrets: [db_password, email_intake_key]
    tmpfs:
      - /keys:uid=1654,gid=1654,mode=0700
      - /attachments:uid=1654,gid=1654,mode=0700
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
  clamav:
    image: clamav/clamav:1.4.5@sha256:4de20bd9ab45a4b763c5412b769217ef5082572ebc8a63aff1a77943419e5dd8
    volumes:
      - clamav_data:/var/lib/clamav
  clamav-probe:
    image: node:22-alpine
    profiles: [verification]
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      - ./scripts/clamav-smoke.mjs:/work/clamav-smoke.mjs:ro
    command: [node, /work/clamav-smoke.mjs]
    depends_on: [clamav]
  dashboard:
    image: omnidesk-dashboard:local
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./deploy/smoke.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs: [/data, /config]
    depends_on: [api, dashboard]
    networks:
      default:
        aliases: [omnidesk.test]
  probe:
    image: node:22-alpine
    working_dir: /work
    volumes:
      - ./scripts/smoke.mjs:/work/smoke.mjs:ro
    secrets: [bootstrap_password]
    command: [node, /work/smoke.mjs]
    depends_on: [caddy]
  browser:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    profiles: [browser]
    volumes:
      - ./scripts/browser-smoke.mjs:/work/browser-smoke.mjs:ro
      - ./artifacts/ui-preview:/previews
    secrets: [bootstrap_password, email_intake_key]
    command: [sh, -c, 'cd /tmp && npm install --no-audit --no-fund --ignore-scripts playwright@1.58.2 && node /work/browser-smoke.mjs']
    depends_on: [caddy]
secrets:
  db_password:
    file: ${SMOKE_SECRETS:?Set isolated secret directory}/db_password
  bootstrap_password:
    file: ${SMOKE_SECRETS:?Set isolated secret directory}/bootstrap_password
  email_intake_key:
    file: ${SMOKE_SECRETS:?Set isolated secret directory}/email_intake_key

volumes:
  clamav_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.85.0/24
